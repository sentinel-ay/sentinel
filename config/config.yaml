simulator:
  dt: 0.1
  steps: 200
  x0: [0.0, 0.0]
  vx: 1.0
  vy: 0.5
  accel_std: 0.05
  turn_rate: 0.0

sensors:
  gps:
    noise_std: 0.3
    bias: 0.05
    drift_rate: 0.001
    dropout_prob: 0.02
    outlier_prob: 0.01
  imu:
    noise_std: 0.2
    bias: 0.03
    drift_rate: 0.0005
    dropout_prob: 0.01
    outlier_prob: 0.008
  velocity:
    noise_std: 0.15
    bias: 0.02
    drift_rate: 0.0005
    dropout_prob: 0.01
    outlier_prob: 0.01
  distance:
    noise_std: 0.25
    bias: 0.04
    drift_rate: 0.0008
    dropout_prob: 0.015
    outlier_prob: 0.008

estimation:
  q: 0.1
  r_gps: 0.5
  r_imu: 0.3
  r_velocity: 0.2
  r_distance: 0.4

anomaly:
  zscore_threshold: 3.0
  contamination: 0.05

project:
  random_seed: 42